name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: lumirelle/workflows/.github/workflows/ci.yml@v10
    with:
      cache-preset: 'mise-task,nub'
      primary-os: ubuntu-latest
      os-matrix: '"ubuntu-latest", "macos-latest", "windows-latest"'
